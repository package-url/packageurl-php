# For details of what checks are run for PRs please refer below
# see https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: PHP CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
  workflow_dispatch:
  schedule:
    # schedule weekly tests, since dependencies are not intended to be pinned
    # this means: at 23:42 on Fridays
    - cron: '42 23 * * 5'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions: { }

defaults:
  run:
    shell: bash

env:
  PHP_VERSION_LATEST: '8.6'

jobs:
  tests:
    name: php${{ matrix.php-version }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      REPORTS_DIR: CI_reports
      REPORTS_ARTIFACT: tests-reports
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        php-version:
          - '8.6' # highest supported
          - '8.5'
          - '8.4'
          - '8.3' # lowest supported
        include:
          - # highest supported Windows
            os: windows-latest
            php-version: '8.6' # highest supported
          - # highest supported macOS
            os: macos-latest
            php-version: '8.6'
    timeout-minutes: 30
    steps:
      - name: Checkout
        # see https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        # see https://github.com/shivammathur/setup-php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json
          tools: composer:v2
          coverage: pcov
        env:
          update: true
      - name: dir setup
        run: mkdir -p "$REPORTS_DIR"
      - name: Validate composer.json and composer.lock
        run: >
          composer validate
      - name: Install dependencies
        run: >
          composer install
          --prefer-dist
          --no-progress
          --no-suggest
      - name: Run PHPUnit tests
        env:
          OS: ${{ matrix.os }}
          PHP_VERSION: ${{ matrix.php-version }}
        run: >
          php
          -d zend.assertions=1 -d assert.exception=1
          -d display_errors=On -d display_startup_errors=On -d error_reporting=-1
          -d log_errors_max_len=0
          -d memory_limit=-1
          -d xdebug.show_exception_trace=0 -d xdebug.mode=coverage
          -d pcov.enabled=1 -d pcov.directory=src
          vendor/phpunit/phpunit/phpunit
          --no-progress
          --log-junit="${REPORTS_DIR}/tests.${OS}_php${PHP_VERSION}.junit.xml"
          --coverage-clover="${REPORTS_DIR}/coverage.${OS}_php${PHP_VERSION}.clover.xml"
      - name: Artifact reports
        if: ${{ ! cancelled() }}
        # see https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: '${{ env.REPORTS_ARTIFACT }}_PHPUnit_php${{ matrix.php-version }}_${{ matrix.os }}'
          path: ${{ env.REPORTS_DIR }}
          if-no-files-found: error
  code-checker:
    name: Code Analysis (php${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPORTS_DIR: CI_reports
      REPORTS_ARTIFACT: code-reports
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.6' # highest supported
          - '8.3' # lowest supported
    steps:
      - name: Checkout
        # see https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        # see https://github.com/shivammathur/setup-php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none
        env:
          update: true
      - name: Install psalm
        run: >
          composer install
          --prefer-dist
          --no-progress
          --no-suggest
        working-directory: tools/psalm
      - name: Install dependencies
        run: >
          composer install
          --no-dev
          --prefer-dist
          --no-progress
          --no-suggest
      - name: Run Psalm tests
        env:
          PHP_VERSION: ${{ matrix.php-version }}
        run: >
          php tools/psalm/vendor/vimeo/psalm/psalm
          --no-diff
          --no-cache
          --long-progress
          --output-format=github
          --report="${REPORTS_DIR}/psalm.php${PHP_VERSION}.junit.xml"
          --stats
          --shepherd
      - name: Artifact reports
        if: ${{ ! cancelled() }}
        # see https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: '${{ env.REPORTS_ARTIFACT }}_CodeCheck_php${{ matrix.php-version }}'
          path: ${{ env.REPORTS_DIR }}
          if-no-files-found: error
  style-checker:
    name: Coding Standards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # see https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        # see https://github.com/shivammathur/setup-php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION_LATEST }}
          tools: composer:v2
          coverage: none
        env:
          update: true
      - name: Install PHP-CS-Fixer
        run: >
          composer install
          --prefer-dist
          --no-progress
          --no-suggest
        working-directory: tools/php-cs-fixer
      - name: Install dependencies
        run: >
          composer install
          --no-dev
          --prefer-dist
          --no-progress
          --no-suggest
      - name: Run PHP-CS-Fixer tests
        run: >
          php tools/php-cs-fixer/vendor/friendsofphp/php-cs-fixer/php-cs-fixer
          check
          --diff
          --using-cache=no
          --show-progress=dots
          --no-interaction
  composer-require-checker:
    name: ComposerRequireChecker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # see https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        # see https://github.com/shivammathur/setup-php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION_LATEST }}
          tools: composer:v2
          coverage: none
        env:
          update: true
      - name: Install composer-require-checker
        run: >
          composer install
          --prefer-dist
          --no-progress
          --no-suggest
        working-directory: tools/composer-require-checker
      - name: Install dependencies
        run: >
          composer install
          --no-dev
          --prefer-dist
          --no-progress
          --no-suggest
      - name: Run composer-require-checker tests
        run: >
          php tools/composer-require-checker/vendor/maglnet/composer-require-checker/bin/composer-require-checker
          --no-interaction
  composer-unused:
    name: ComposerUnused
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # see https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        # see https://github.com/shivammathur/setup-php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION_LATEST }}
          tools: composer:v2
          coverage: none
        env:
          update: true
      - name: Install composer-require-checker
        run: >
          composer install
          --prefer-dist
          --no-progress
          --no-suggest
        working-directory: tools/composer-unused
      - name: Install dependencies
        run: >
          composer install
          --no-dev
          --prefer-dist
          --no-progress
          --no-suggest
      - name: Run composer-unused tests
        run: >
          php tools/composer-unused/vendor/icanhazstring/composer-unused/bin/composer-unused
          --no-progress
          --no-interaction
          --excludeDir=tools
  composer-normalize:
    name: Composer normalize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # see https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        # see https://github.com/shivammathur/setup-php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION_LATEST }}
          tools: composer:v2
          coverage: none
        env:
          update: true
      - name: Install composer-normalize
        run: >
          composer install
          --prefer-dist
          --no-progress
          --no-suggest
        working-directory: tools/composer-normalize
      - name: Run composer-normalize tests
        run: >
          composer -dtools/composer-normalize
          normalize
          --dry-run
          --diff
          --no-check-lock
          --no-update-lock
          --no-interaction
          "$PWD/composer.json"
